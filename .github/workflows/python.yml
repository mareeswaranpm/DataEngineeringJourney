name: Customer Analysis Build

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - name: Install Packages
        run: |
          pip install pandas

      - name: Run Program
        run: |
          python src/pandas_transformation.py

      - name: Build Docker Image

        run: |
          docker build -t customer-analysis .
      - name: Run Docker Container
        run: |
          docker run customer-analysis  